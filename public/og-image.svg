<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="bleed" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="5" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="200" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="g1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8fd0e6" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#b5e0ef" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8f6fb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#fbf9f6"/>
  <g filter="url(#bleed)">
    <ellipse cx="1050" cy="470" rx="260" ry="200" fill="url(#g1)"/>
    <ellipse cx="1160" cy="190" rx="180" ry="150" fill="url(#g1)"/>
  </g>
  <rect width="1200" height="630" filter="url(#paper)" opacity="0.07"/>

  <text x="84" y="300" font-family="Prata, 'Playfair Display', Georgia, serif"
        font-size="104" fill="#0b0c0e" letter-spacing="-1">Eurasia Art</text>
  <text x="84" y="404" font-family="Prata, 'Playfair Display', Georgia, serif"
        font-size="104" fill="#0b0c0e" letter-spacing="-1">Platform</text>
  <text x="86" y="482" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21"
        fill="#4a4a4c" letter-spacing="4.4">OPEN CALL · CONTEMPORARY ART OF EURASIA</text>
</svg>
